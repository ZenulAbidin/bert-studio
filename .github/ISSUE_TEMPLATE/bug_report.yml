name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and response
      description: The request you sent and the response or error. Remove API keys and tokens.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Backend log
      description: Output of `docker compose logs backend` around the error.
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or image
      placeholder: e.g. 0d75c80, or the image tag you run
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Inference device
      options: [CPU, NVIDIA GPU, Not sure]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: Hub id or "own fine-tuned model"
