version: "3.8"

services:
  backend:
    build: .
    container_name: bert-backend
    env_file:
      - ./backend/.env.local
    ports:
      - "127.0.0.1:4794:4794"
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - model_cache:/models
    restart: unless-stopped
    # Uncomment if you want to mount code for live reload in dev
    # volumes:
    #   - ./backend:/app/backend
    #   - ./src:/app/src
    #   - ./public:/app/public

  mongo:
    image: mongo:6
    container_name: bert-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  caddy:
    image: caddy:2
    container_name: bert-caddy
    ports:
      - "127.0.0.1:4793:4793"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mongo_data:
  model_cache:
  caddy_data:
  caddy_config:
