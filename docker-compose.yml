version: "3.8"

services:
  bert_studio:
    build: .
    container_name: bert-backend
    env_file:
      - ./backend/.env.local
    expose:
      - "4794"
    depends_on:
      - mongo
    # Uncomment if you want to mount code for live reload in dev
    # volumes:
    #   - ./backend:/app/backend
    #   - ./src:/app/src
    #   - ./public:/app/public

  mongo:
    image: mongo:6
    container_name: bert-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  caddy:
    image: caddy:2
    container_name: bert-caddy
    ports:
      - "4793:4793"
    volumes:
      - ./backend/static:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  mongo_data:
  caddy_data:
  caddy_config: